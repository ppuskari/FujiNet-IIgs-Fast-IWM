name: Fast-IWM P0.2B Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse P0.2B scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host ("Windows PowerShell " + $PSVersionTable.PSVersion)
          if ($PSVersionTable.PSVersion.Major -ne 5) {
              throw "Expected Windows PowerShell 5.x"
          }
          $paths = @(
              '.\scripts\Build-FastProbe-P02B.ps1',
              '.\scripts\Prepare-FujiNet-FastIWM-P02B.ps1'
          )
          foreach ($item in $paths) {
              $tokens = $null
              $errors = $null
              $path = (Resolve-Path $item).Path
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $path,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null
              if ($errors.Count -ne 0) {
                  $errors | ForEach-Object { Write-Host $_.Message }
                  throw ("PowerShell 5.1 parse failed: " + $item)
              }
              Write-Host ("PowerShell 5.1 parse passed: " + $item)
          }

  fastprobe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Merlin32
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/apple2accumulator/merlin32.git /tmp/merlin32
          make -C /tmp/merlin32/Source

      - name: Assemble FASTPROBE P0.2B
        working-directory: iigs/fastprobe/src
        run: |
          set -euo pipefail
          /tmp/merlin32/Source/merlin32 -V /tmp/merlin32/Library fastprobe.make.s
          test -f FASTPROBE
          test -f FASTPROBE_Output.txt

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build CiderPress II cp2
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/fadden/CiderPress2.git /tmp/CiderPress2
          cd /tmp/CiderPress2
          ./mkcp2.sh

      - name: Package and validate FASTPROBE
        run: |
          set -euo pipefail
          CP2="dotnet /tmp/CiderPress2/cp2/bin/Release/net10.0/cp2.dll"
          OUT="$GITHUB_WORKSPACE/build-ci/fastprobe-p0.2b"
          mkdir -p "$OUT"
          cp iigs/fastprobe/src/FASTPROBE "$OUT/FASTPROBE#B30000"
          cp iigs/fastprobe/src/FASTPROBE_Output.txt "$OUT/FASTPROBE_Output.txt"
          printf 'FASTPROBE P0.2B - private IIgs/FujiNet 2us wire test\n' > "$OUT/README#040000"
          $CP2 create-disk-image "$OUT/FASTPROBE-P0.2B.po" 32mb ProDOS
          $CP2 rename "$OUT/FASTPROBE-P0.2B.po" : FASTPROBE
          $CP2 add --from-naps --strip-paths "$OUT/FASTPROBE-P0.2B.po" "$OUT/FASTPROBE#B30000"
          $CP2 add --from-naps --strip-paths "$OUT/FASTPROBE-P0.2B.po" "$OUT/README#040000"
          $CP2 catalog --depth=max --wide "$OUT/FASTPROBE-P0.2B.po" | tee "$OUT/FASTPROBE-P0.2B.catalog.txt"
          $CP2 test "$OUT/FASTPROBE-P0.2B.po"
          cd "$OUT"
          sha256sum 'FASTPROBE#B30000' FASTPROBE-P0.2B.po > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fastprobe-p0.2b-deployable
          path: build-ci/fastprobe-p0.2b/

  fujinet-production-rev1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned FujiNet baseline
        run: |
          set -euo pipefail
          git clone https://github.com/FujiNetWIFI/fujinet-firmware.git /tmp/fujinet-firmware
          cd /tmp/fujinet-firmware
          git checkout b0a9483463c93ab61279d265467159c0d27c9f82

      - name: Verify production Rev1 uses runtime auto-detection
        run: |
          set -euo pipefail
          SRC=/tmp/fujinet-firmware/lib/hardware/fnSystem.cpp
          grep -q 'Apple 2 Rev 1 Latest has pulldown on IO25' "$SRC"
          grep -q 'FujiApple Rev1 Buffered Bus' "$SRC"
          grep -q 'For the 3 people on earth who got Rev1 hardware' "$SRC"

      - name: Apply private Fast-IWM responder patch
        run: |
          set -euo pipefail
          python3 tools/patch_fujinet_fastiwm_p02b.py --firmware-root /tmp/fujinet-firmware
          grep -q 'fast_iwm_probe_armed' /tmp/fujinet-firmware/lib/bus/iwm/iwm_ll.cpp
          grep -q 'fastcfg.clock_speed_hz = 2 \* MHZ' /tmp/fujinet-firmware/lib/bus/iwm/iwm_ll.cpp
          grep -q 'iwm_send_fast_probe_spi' /tmp/fujinet-firmware/lib/bus/iwm/iwm_ll.h

      - name: Create production FujiApple Rev1 PlatformIO config
        run: |
          set -euo pipefail
          cd /tmp/fujinet-firmware
          cp platformio-sample.ini platformio.ini
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platformio.ini')
          t = p.read_text(encoding='utf-8')
          for old, new in (
              (';build_platform = BUILD_APPLE', 'build_platform = BUILD_APPLE'),
              (';build_bus      = IWM', 'build_bus      = IWM'),
              (';build_board    = fujiapple-rev0         ; FujiApple Rev 0 Prototype',
               'build_board    = fujiapple-rev0         ; FujiApple production Rev1 via runtime detection'),
          ):
              if old not in t:
                  raise SystemExit('Missing PlatformIO sample pattern: ' + old)
              t = t.replace(old, new, 1)

          needle = '    -D DEBUG_SPEED=${env.monitor_speed}\n'
          if needle not in t:
              raise SystemExit('Unable to locate common build_flags block')
          t = t.replace(needle, needle + '    -D IIGS_FAST_IWM_PROBE\n', 1)

          # Production Rev1 must use the normal runtime detection path.
          # Do NOT enable REV1DETECT, MASTERIES_*, or NO3STATE.
          p.write_text(t, encoding='utf-8', newline='\n')
          PY

          if grep -Eq '^[[:space:]]*-D[[:space:]]+REV1DETECT' platformio.ini; then
            echo 'ERROR: REV1DETECT must not be enabled for production Rev1 hardware.' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*-D[[:space:]]+MASTERIES_' platformio.ini; then
            echo 'ERROR: MASTERIES override unexpectedly enabled.' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*-D[[:space:]]+NO3STATE([[:space:]]|$)' platformio.ini; then
            echo 'ERROR: NO3STATE override unexpectedly enabled.' >&2
            exit 1
          fi

      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade platformio

      - name: Compile production FujiApple Rev1 firmware
        working-directory: /tmp/fujinet-firmware
        run: |
          set -euo pipefail
          pio run -e fujiapple-rev0

      - name: Build LittleFS image
        working-directory: /tmp/fujinet-firmware
        run: |
          set -euo pipefail
          pio run -e fujiapple-rev0 -t buildfs

      - name: Package production Rev1 firmware
        run: |
          set -euo pipefail
          SRC=/tmp/fujinet-firmware/.pio/build/fujiapple-rev0
          OUT="$GITHUB_WORKSPACE/build-ci/fujinet-p0.2b-production-rev1"
          mkdir -p "$OUT"

          for f in firmware.bin bootloader.bin partitions.bin littlefs.bin firmware.elf partitions.csv; do
            if [ -f "$SRC/$f" ]; then
              cp "$SRC/$f" "$OUT/$f"
            fi
          done

          test -f "$OUT/firmware.bin"
          test -f "$OUT/bootloader.bin"
          test -f "$OUT/partitions.bin"

          cp /tmp/fujinet-firmware/platformio.ini "$OUT/platformio.production-rev1.ini"
          git -C /tmp/fujinet-firmware diff -- lib/bus/iwm/iwm_ll.h lib/bus/iwm/iwm_ll.cpp > "$OUT/fujinet-p0.2b.patch"

          cat > "$OUT/README.txt" <<'EOF'
FujiNet Fast-IWM P0.2B - FujiApple production Rev1

Pinned upstream:
  b0a9483463c93ab61279d265467159c0d27c9f82

Build selectors:
  BUILD_APPLE
  IWM
  fujiapple-rev0
  PINMAP_A2_REV0
  IIGS_FAST_IWM_PROBE

Intentionally NOT enabled:
  REV1DETECT
  MASTERIES_REV0
  MASTERIES_REVAB
  NO3STATE

Production Rev1 hardware is detected at runtime by upstream FujiNet firmware.
Normal SmartPort remains at the upstream 1 MHz transmitter timing.
The private FASTPROBE responder alone uses the added 2 MHz transmitter.
EOF

          cd "$OUT"
          sha256sum *.bin > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fujinet-p0.2b-production-rev1-firmware
          path: build-ci/fujinet-p0.2b-production-rev1/
