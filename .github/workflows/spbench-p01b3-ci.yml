name: SPBENCH P0.1B3 CI

on:
  push:
    branches:
      - exp/spbench-p0.1b3
  pull_request:
    branches:
      - exp/spbench-p0.1b2
  workflow_dispatch:

jobs:
  powershell51:
    runs-on: windows-latest

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Parse builder with Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host ("Windows PowerShell " + $PSVersionTable.PSVersion)
          if ($PSVersionTable.PSVersion.Major -ne 5) {
              throw "Expected Windows PowerShell 5.x"
          }

          $tokens = $null
          $errors = $null
          $path = (Resolve-Path '.\scripts\Build-SPBench-P01B3.ps1').Path

          [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null

          if ($errors.Count -ne 0) {
              $errors | ForEach-Object {
                  Write-Host $_.Message
              }
              throw "PowerShell 5.1 parse failed"
          }

          Write-Host "PowerShell 5.1 parse passed."

  assemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Apply P0.1B3 standard SmartPort patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_spbench_p01b3_v2.py
          grep -q 'SPBENCH P0.1B3' iigs/spbench/src/SPBench.s
          grep -q 'InitTextConsole' iigs/spbench/src/SPBench.s
          grep -q 'db    $01' iigs/spbench/src/SPBench.s
          grep -q 'RawStageBuffer' iigs/spbench/src/SPBench.s
          if grep -q 'db    $41' iigs/spbench/src/SPBench.s; then
            echo 'Extended $41 call residue remains'
            exit 1
          fi

      - name: Build Merlin32
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/apple2accumulator/merlin32.git \
            /tmp/merlin32
          make -C /tmp/merlin32/Source

      - name: Assemble SPBENCH P0.1B3
        shell: bash
        working-directory: iigs/spbench/src
        run: |
          set -euo pipefail
          /tmp/merlin32/Source/merlin32 \
            -V /tmp/merlin32/Library \
            spbench.make.s
          test -f SPBENCH
          test -f SPBENCH_Output.txt
          ls -l SPBENCH SPBENCH_Output.txt

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build CiderPress II cp2
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/fadden/CiderPress2.git \
            /tmp/CiderPress2
          cd /tmp/CiderPress2
          ./mkcp2.sh
          test -f cp2/bin/Release/net10.0/cp2.dll

      - name: Build and validate ProDOS deployment image
        shell: bash
        run: |
          set -euo pipefail
          CP2="dotnet /tmp/CiderPress2/cp2/bin/Release/net10.0/cp2.dll"
          OUT="$GITHUB_WORKSPACE/build-ci/spbench-p0.1b3"
          mkdir -p "$OUT"

          cp iigs/spbench/src/SPBENCH "$OUT/SPBENCH#B30000"
          cp iigs/spbench/src/SPBENCH_Output.txt "$OUT/SPBENCH_Output.txt"

          cat > "$OUT/README#040000" <<'EOF'
          SPBENCH P0.1B3 - standard SmartPort baseline

          Mount this image on FujiNet and launch SPBENCH from this volume.
          GS/OS is used only for device discovery. The timed path issues
          standard SmartPort READBLOCK $01 calls. The command list and a
          throwaway 512-byte staging buffer live entirely in bank $00.

          This experiment follows P0.1B2, which confirmed the IIgs slot-5
          SmartPort dispatcher at $C50D and C5FF=$0A but still returned
          error $01 with extended READBLOCK $41.
          EOF

          $CP2 create-disk-image "$OUT/SPBENCH-P0.1B3.po" 32mb ProDOS
          $CP2 rename "$OUT/SPBENCH-P0.1B3.po" : SPBENCH
          $CP2 add --from-naps --strip-paths \
            "$OUT/SPBENCH-P0.1B3.po" "$OUT/SPBENCH#B30000"
          $CP2 add --from-naps --strip-paths \
            "$OUT/SPBENCH-P0.1B3.po" "$OUT/README#040000"
          $CP2 catalog --depth=max --wide \
            "$OUT/SPBENCH-P0.1B3.po" | tee "$OUT/SPBENCH-P0.1B3.catalog.txt"
          $CP2 test "$OUT/SPBENCH-P0.1B3.po"

          cd "$OUT"
          sha256sum \
            'SPBENCH#B30000' \
            SPBENCH-P0.1B3.po \
            > SHA256SUMS.txt

      - name: Upload deployable SPBENCH P0.1B3
        uses: actions/upload-artifact@v4
        with:
          name: spbench-p0.1b3-deployable
          path: build-ci/spbench-p0.1b3/
