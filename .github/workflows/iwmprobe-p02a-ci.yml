name: IWMPROBE P0.2A CI

on:
  push:
    branches:
      - exp/spbench-p0.1b3
  workflow_dispatch:

jobs:
  powershell51:
    runs-on: windows-latest

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Parse builder with Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host ("Windows PowerShell " + $PSVersionTable.PSVersion)
          if ($PSVersionTable.PSVersion.Major -ne 5) {
              throw "Expected Windows PowerShell 5.x"
          }

          $tokens = $null
          $errors = $null
          $path = (Resolve-Path '.\scripts\Build-IWMProbe-P02A.ps1').Path

          [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null

          if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "PowerShell 5.1 parse failed"
          }

          Write-Host "PowerShell 5.1 parse passed."

  assemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Build Merlin32
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/apple2accumulator/merlin32.git \
            /tmp/merlin32
          make -C /tmp/merlin32/Source

      - name: Assemble IWMPROBE P0.2A
        shell: bash
        working-directory: iigs/iwmprobe/src
        run: |
          set -euo pipefail
          /tmp/merlin32/Source/merlin32 \
            -V /tmp/merlin32/Library \
            iwmprobe.make.s
          test -f IWMPROBE
          test -f IWMPROBE_Output.txt
          ls -l IWMPROBE IWMPROBE_Output.txt

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build CiderPress II cp2
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/fadden/CiderPress2.git \
            /tmp/CiderPress2
          cd /tmp/CiderPress2
          ./mkcp2.sh
          test -f cp2/bin/Release/net10.0/cp2.dll

      - name: Build and validate ProDOS deployment image
        shell: bash
        run: |
          set -euo pipefail
          CP2="dotnet /tmp/CiderPress2/cp2/bin/Release/net10.0/cp2.dll"
          OUT="$GITHUB_WORKSPACE/build-ci/iwmprobe-p0.2a"
          mkdir -p "$OUT"

          cp iigs/iwmprobe/src/IWMPROBE "$OUT/IWMPROBE#B30000"
          cp iigs/iwmprobe/src/IWMPROBE_Output.txt "$OUT/IWMPROBE_Output.txt"

          cat > "$OUT/README#040000" <<'EOF'
          IWMPROBE P0.2A - Apple IIgs IWM mode probe

          Host-side register probe only. No disk transfer is attempted while
          2 us mode is active. The original IWM mode is restored before exit.
          If RESTORE FAILED is displayed, reboot before accessing disks.
          EOF

          $CP2 create-disk-image "$OUT/IWMPROBE-P0.2A.po" 32mb ProDOS
          $CP2 rename "$OUT/IWMPROBE-P0.2A.po" : IWMPROBE
          $CP2 add --from-naps --strip-paths \
            "$OUT/IWMPROBE-P0.2A.po" "$OUT/IWMPROBE#B30000"
          $CP2 add --from-naps --strip-paths \
            "$OUT/IWMPROBE-P0.2A.po" "$OUT/README#040000"
          $CP2 catalog --depth=max --wide \
            "$OUT/IWMPROBE-P0.2A.po" | tee "$OUT/IWMPROBE-P0.2A.catalog.txt"
          $CP2 test "$OUT/IWMPROBE-P0.2A.po"

          cd "$OUT"
          sha256sum \
            'IWMPROBE#B30000' \
            IWMPROBE-P0.2A.po \
            > SHA256SUMS.txt

      - name: Upload deployable IWMPROBE P0.2A
        uses: actions/upload-artifact@v4
        with:
          name: iwmprobe-p0.2a-deployable
          path: build-ci/iwmprobe-p0.2a/
