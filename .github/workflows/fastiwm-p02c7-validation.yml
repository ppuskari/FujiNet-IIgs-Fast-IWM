name: FASTIWM P0.2C7 validation

on:
  push:
    branches:
      - exp/fastiwm-p0.2c7-iwm-fastmode
  workflow_dispatch:

jobs:
  powershell51:
    runs-on: windows-latest
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Parse P0.2C7 builder with Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host ("Windows PowerShell " + $PSVersionTable.PSVersion)
          if ($PSVersionTable.PSVersion.Major -ne 5) {
              throw "Expected Windows PowerShell 5.x"
          }
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path '.\scripts\Build-FastProbe-P02C7.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "PowerShell 5.1 parse failed"
          }
          Write-Host "PowerShell 5.1 parse passed."

  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Apply P0.2C7 host transform
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_spbench_p01b3_v2.py
          python3 tools/fix_spbench_p01b3_branches.py
          python3 tools/patch_spbench_fastiwm_p02c7.py --project-root "$GITHUB_WORKSPACE"
          python3 tools/fix_fastiwm_p02c_branches.py --project-root "$GITHUB_WORKSPACE"
          grep -q 'FASTPROBE P0.2C7' iigs/spbench/src/SPBench.s
          grep -q 'IWMFastMode     equ   $0F' iigs/spbench/src/SPBench.s
          grep -q 'sta   >IWM_Q7_ON' iigs/spbench/src/SPBench.s
          grep -q 'eor   >IWM_Q7_OFF' iigs/spbench/src/SPBench.s
          grep -q 'FastModeSaved' iigs/spbench/src/SPBench.s

      - name: Build Merlin32
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/apple2accumulator/merlin32.git \
            /tmp/merlin32
          make -C /tmp/merlin32/Source

      - name: Assemble FASTPROBE P0.2C7
        shell: bash
        working-directory: iigs/spbench/src
        run: |
          set -euo pipefail
          /tmp/merlin32/Source/merlin32 \
            -V /tmp/merlin32/Library \
            spbench.make.s
          test -f SPBENCH
          test -f SPBENCH_Output.txt
          ls -l SPBENCH SPBENCH_Output.txt

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build CiderPress II cp2
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/fadden/CiderPress2.git \
            /tmp/CiderPress2
          cd /tmp/CiderPress2
          ./mkcp2.sh
          test -f cp2/bin/Release/net10.0/cp2.dll

      - name: Build and validate P0.2C7 ProDOS image
        shell: bash
        run: |
          set -euo pipefail
          CP2="dotnet /tmp/CiderPress2/cp2/bin/Release/net10.0/cp2.dll"
          OUT="$GITHUB_WORKSPACE/build-ci/fastiwm-p0.2c7"
          mkdir -p "$OUT"

          cp iigs/spbench/src/SPBENCH "$OUT/FASTPROBE-P0.2C7#B30000"
          cp iigs/spbench/src/SPBENCH_Output.txt "$OUT/FASTPROBE-P0.2C7_Output.txt"

          cat > "$OUT/README-P0.2C7#040000" <<'EOF'
          FASTPROBE P0.2C7 - IIgs IWM 2us receive mode

          KEEP FujiNet P0.2C4 delayed-autosend firmware flashed.

          This build explicitly changes the Apple IIgs IWM from its normal
          4us SmartPort timing to mode $0F before the private receive window.
          The prior IWM mode and IIgs Speed register are restored on exit.

          Expected success message:
            FAST PASS: exact 512-byte 2us payload verified.
          EOF

          $CP2 create-disk-image "$OUT/FASTPROBE-P0.2C7.po" 32mb ProDOS
          $CP2 rename "$OUT/FASTPROBE-P0.2C7.po" : FASTPROBE
          $CP2 add --from-naps --strip-paths \
            "$OUT/FASTPROBE-P0.2C7.po" "$OUT/FASTPROBE-P0.2C7#B30000"
          $CP2 add --from-naps --strip-paths \
            "$OUT/FASTPROBE-P0.2C7.po" "$OUT/README-P0.2C7#040000"
          $CP2 catalog --depth=max --wide \
            "$OUT/FASTPROBE-P0.2C7.po" | tee "$OUT/FASTPROBE-P0.2C7.catalog.txt"
          $CP2 test "$OUT/FASTPROBE-P0.2C7.po"

          cd "$OUT"
          sha256sum \
            'FASTPROBE-P0.2C7#B30000' \
            FASTPROBE-P0.2C7.po \
            > SHA256SUMS.txt

      - name: Upload deployable FASTPROBE P0.2C7
        uses: actions/upload-artifact@v4
        with:
          name: fastprobe-p0.2c7-deployable
          path: build-ci/fastiwm-p0.2c7/
