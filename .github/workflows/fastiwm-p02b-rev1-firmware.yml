name: Fast-IWM P0.2B FujiApple Rev1 Firmware

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  rev1-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned FujiNet baseline
        run: |
          set -euo pipefail
          git clone https://github.com/FujiNetWIFI/fujinet-firmware.git /tmp/fujinet-firmware
          cd /tmp/fujinet-firmware
          git checkout b0a9483463c93ab61279d265467159c0d27c9f82

      - name: Apply private Fast-IWM responder patch
        run: |
          set -euo pipefail
          python3 tools/patch_fujinet_fastiwm_p02b.py --firmware-root /tmp/fujinet-firmware

      - name: Create exact FujiApple Rev1 PlatformIO config
        run: |
          set -euo pipefail
          cd /tmp/fujinet-firmware
          cp platformio-sample.ini platformio.ini
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platformio.ini')
          t = p.read_text(encoding='utf-8')
          pairs = (
              (';build_platform = BUILD_APPLE', 'build_platform = BUILD_APPLE'),
              (';build_bus      = IWM', 'build_bus      = IWM'),
              (';build_board    = fujiapple-rev0         ; FujiApple Rev 0 Prototype',
               'build_board    = fujiapple-rev0         ; FujiApple Rev 0 Prototype'),
          )
          for old, new in pairs:
              if old not in t:
                  raise SystemExit('Missing PlatformIO sample pattern: ' + old)
              t = t.replace(old, new, 1)

          needle = '    -D DEBUG_SPEED=${env.monitor_speed}\n'
          if needle not in t:
              raise SystemExit('Unable to locate common build_flags block')
          t = t.replace(
              needle,
              needle +
              '    -D IIGS_FAST_IWM_PROBE\n',
              1
          )

          rev1 = '    ;-D REV1DETECT ; Only 3 people on earth need this enabled. You know who you are :P\n'
          if rev1 not in t:
              raise SystemExit('Unable to locate REV1DETECT build flag')
          t = t.replace(
              rev1,
              '    -D REV1DETECT ; FujiApple early Rev1 hardware\n',
              1
          )

          p.write_text(t, encoding='utf-8', newline='\n')
          PY

      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade platformio

      - name: Compile exact FujiApple Rev1 firmware
        working-directory: /tmp/fujinet-firmware
        run: |
          set -euo pipefail
          pio run -e fujiapple-rev0

      - name: Build LittleFS image
        working-directory: /tmp/fujinet-firmware
        run: |
          set -euo pipefail
          pio run -e fujiapple-rev0 -t buildfs

      - name: Package Rev1 firmware
        run: |
          set -euo pipefail
          SRC=/tmp/fujinet-firmware/.pio/build/fujiapple-rev0
          OUT="$GITHUB_WORKSPACE/build-ci/fujinet-p0.2b-rev1"
          mkdir -p "$OUT"

          for f in firmware.bin bootloader.bin partitions.bin littlefs.bin firmware.elf partitions.csv; do
            if [ -f "$SRC/$f" ]; then
              cp "$SRC/$f" "$OUT/$f"
            fi
          done

          if [ ! -f "$OUT/firmware.bin" ]; then
            echo 'firmware.bin missing' >&2
            exit 1
          fi
          if [ ! -f "$OUT/bootloader.bin" ]; then
            echo 'bootloader.bin missing' >&2
            exit 1
          fi
          if [ ! -f "$OUT/partitions.bin" ]; then
            echo 'partitions.bin missing' >&2
            exit 1
          fi

          cp /tmp/fujinet-firmware/platformio.ini "$OUT/platformio.rev1.ini"
          git -C /tmp/fujinet-firmware diff -- lib/bus/iwm/iwm_ll.h lib/bus/iwm/iwm_ll.cpp > "$OUT/fujinet-p0.2b.patch"

          cat > "$OUT/README.txt" <<'EOF'
FujiNet Fast-IWM P0.2B - FujiApple early Rev1

Pinned upstream firmware:
  b0a9483463c93ab61279d265467159c0d27c9f82

Build target:
  BUILD_APPLE
  IWM
  fujiapple-rev0
  PINMAP_A2_REV0
  REV1DETECT
  IIGS_FAST_IWM_PROBE

Normal SmartPort remains at the upstream 1 MHz transmitter timing.
The experimental private responder uses a second 2 MHz transmitter only
for FASTPROBE P0.2B phase 1110/1111 requests.
EOF

          cd "$OUT"
          sha256sum *.bin > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fujinet-p0.2b-rev1-firmware
          path: build-ci/fujinet-p0.2b-rev1/
