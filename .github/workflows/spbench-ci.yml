name: SPBENCH CI

on:
  push:
    branches:
      - exp/spbench-p0.1a
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  powershell51:
    runs-on: windows-latest

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Parse builder with Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host ("Windows PowerShell " + $PSVersionTable.PSVersion)
          if ($PSVersionTable.PSVersion.Major -ne 5) {
              throw "Expected Windows PowerShell 5.x"
          }

          $tokens = $null
          $errors = $null
          $path = (Resolve-Path '.\scripts\Build-SPBench-P01A.ps1').Path

          [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null

          if ($errors.Count -ne 0) {
              $errors | ForEach-Object {
                  Write-Host $_.Message
              }
              throw "PowerShell 5.1 parse failed"
          }

          Write-Host "PowerShell 5.1 parse passed."

  assemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Build Merlin32
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/apple2accumulator/merlin32.git \
            /tmp/merlin32
          make -C /tmp/merlin32/Source

      - name: Assemble SPBENCH P0.1A
        shell: bash
        working-directory: iigs/spbench/src
        run: |
          set -euo pipefail
          /tmp/merlin32/Source/merlin32 \
            -V /tmp/merlin32/Library \
            spbench.make.s
          test -f SPBENCH
          test -f SPBENCH_Output.txt
          ls -l SPBENCH SPBENCH_Output.txt

      - name: Upload assembled binary
        uses: actions/upload-artifact@v4
        with:
          name: spbench-p0.1a
          path: |
            iigs/spbench/src/SPBENCH
            iigs/spbench/src/SPBENCH_Output.txt
